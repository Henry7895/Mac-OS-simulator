name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Remove legacy Actions artifacts so this repository can recover storage.
      # Releases and files committed to Git are not affected by this cleanup.
      - name: Clean stored workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let deleted = 0;
            while (true) {
              const response = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100,
                page: 1
              });
              const artifacts = response.data.artifacts;
              if (artifacts.length === 0) break;
              for (const artifact of artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
                deleted += 1;
              }
            }
            core.info(`Deleted ${deleted} legacy workflow artifact(s).`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify first-run setup and desktop interactions
        run: npm run test:e2e
      - name: Build site
        run: npm run build

      # Deploy the generated site directly to a branch; no Actions artifact upload.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy GitHub Pages from ${{ github.sha }}"

      # Configure branch-based Pages publishing and trigger a build explicitly.
      - name: Configure and request GitHub Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const siteConfig = {
              owner,
              repo,
              build_type: "legacy",
              source: { branch: "gh-pages", path: "/" }
            };
            try {
              let exists = true;
              try {
                await github.request("GET /repos/{owner}/{repo}/pages", { owner, repo });
              } catch (error) {
                if (error.status === 404) exists = false;
                else throw error;
              }
              if (exists) {
                await github.request("PATCH /repos/{owner}/{repo}/pages", siteConfig);
              } else {
                await github.request("POST /repos/{owner}/{repo}/pages", siteConfig);
              }
              const response = await github.rest.repos.requestPagesBuild({ owner, repo });
              core.info(`GitHub Pages build request: ${response.data.status || "queued"}`);
            } catch (error) {
              core.warning(`Could not configure or request a Pages build: ${error.message}`);
              core.warning("Check whether Pages is available for this repository plan and, if needed, select gh-pages / (root) in Settings > Pages.");
            }
